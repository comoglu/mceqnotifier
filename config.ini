# Production Earthquake Notifier Configuration
# Optimized for Canakkale region monitoring with Gmail integration

[service]
# Your SeisComP FDSNWS service
fdsnws_url = http://localhost:8081
min_magnitude = 4.0
check_interval = 60
timeout = 30
max_age_hours = 3

[filtering]
## Canakkale region bounding box filter
#filter_type = bounding_box
#min_latitude = 37.46
#max_latitude = 42.85
#min_longitude = 22.88
#max_longitude = 29.94
#filter_description = Canakkale Region
# World region bounding box filter
filter_type = bounding_box
min_latitude = -90.00
max_latitude = 90.00
min_longitude = -180.00
max_longitude = 180.00
filter_description = World Region

# Optional: Multi-region filtering (comment out to use simple filtering above)
# [regions]
# region_list = [
#   {
#     "name": "Canakkale Major Events", 
#     "type": "bounding_box",
#     "min_magnitude": 3.0,
#     "min_latitude": 37.46,
#     "max_latitude": 42.85,
#     "min_longitude": 22.88,
#     "max_longitude": 29.94
#   },
#   {
#     "name": "Turkey Regional",
#     "type": "bounding_box", 
#     "min_magnitude": 4.5,
#     "min_latitude": 35.0,
#     "max_latitude": 43.0,
#     "min_longitude": 25.0,
#     "max_longitude": 45.0
#   }
# ]

[email]
# Gmail SMTP configuration with App Password
smtp_server = smtp.gmail.com
smtp_port = 587
use_tls = true

# IMPORTANT: Replace with your actual Gmail credentials
# Use App Password, not regular password!
username = comoglu@gmail.com
password = 

# Email addresses
from_address = comoglu@gmail.com
# Multiple recipients separated by commas  
to_addresses = comoglu@gmail.com

[seiscomp]
# SeisComP installation paths
seiscomp_root = /opt/seiscomp
scxmldump_path = /opt/seiscomp/bin/scxmldump
scmapcut_path = /opt/seiscomp/bin/scmapcut
scbulletin_path = /opt/seiscomp/bin/scbulletin
scevtls_path = /opt/seiscomp/bin/scevtls

# Database connection - adjust for your setup
database_url = mysql://sysop:sysop@localhost/seiscomp

[logging]
# Logging configuration
log_file = logs/earthquake_notifier.log
log_level = INFO

[advanced]
# Advanced processing options
concurrent_processing = false
retry_failed_emails = true
cleanup_temp_files = true

# ObsPy-based features (requires ObsPy installation)
generate_travel_time_curves = true
generate_waveform_plots = true
waveform_stations_limit = 10

[bulletin_generator]
# Bulletin Generator Tool Settings
output_dir = output
check_interval = 60
lookback_hours = 1
cleanup_xml = true
map_dimensions = 1024x768
map_min_magnitude = 3.0
